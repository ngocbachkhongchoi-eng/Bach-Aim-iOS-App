name: Build Full IPA bindepzai123

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile Native iOS Binary & Package IPA
        run: |
          mkdir -p AppSource
          cat << 'EOF' > AppSource/main.m
          #import <UIKit/UIKit.h>

          @interface MainViewController : UIViewController
          @property (nonatomic, strong) UIProgressView *progressView;
          @property (nonatomic, strong) UILabel *progressLabel;
          @property (nonatomic, strong) NSTimer *injectTimer;
          @property (nonatomic, assign) float currentProgress;
          @property (nonatomic, strong) NSString *currentInjectName;
          @end

          @implementation MainViewController

          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithRed:0.07 green:0.08 blue:0.11 alpha:1.0];
              
              UIScrollView *scrollView = [[UIScrollView alloc] initWithFrame:self.view.bounds];
              scrollView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              [self.view addSubview:scrollView];
              
              CGFloat width = self.view.bounds.size.width;
              
              // Tiêu đề nhỏ gọn
              UILabel *headerLabel = [[UILabel alloc] initWithFrame:CGRectMake(15, 50, width - 30, 30)];
              headerLabel.text = @"⚡ BINĐẸPZAI123 HUB ⚡";
              headerLabel.font = [UIFont systemFontOfSize:20 weight:UIFontWeightBold];
              headerLabel.textColor = [UIColor colorWithRed:0.00 green:0.85 blue:1.00 alpha:1.0];
              headerLabel.textAlignment = NSTextAlignmentCenter;
              [scrollView addSubview:headerLabel];
              
              CGFloat y = 90;
              
              // Thanh tiến trình Inject 1% -> 100%
              self.progressLabel = [[UILabel alloc] initWithFrame:CGRectMake(20, y, width - 40, 20)];
              self.progressLabel.text = @"Trạng thái: Sẵn sàng";
              self.progressLabel.font = [UIFont systemFontOfSize:13 weight:UIFontWeightMedium];
              self.progressLabel.textColor = [UIColor lightGrayColor];
              self.progressLabel.textAlignment = NSTextAlignmentCenter;
              [scrollView addSubview:self.progressLabel];
              y += 25;
              
              self.progressView = [[UIProgressView alloc] initWithProgressViewStyle:UIProgressViewStyleDefault];
              self.progressView.frame = CGRectMake(30, y, width - 60, 10);
              self.progressView.progressTintColor = [UIColor systemGreenColor];
              self.progressView.trackTintColor = [UIColor darkGrayColor];
              self.progressView.progress = 0.0;
              [scrollView addSubview:self.progressView];
              y += 25;
              
              // Section 1: Inject Game
              [self addSectionTitle:@"🔥 INJECT FREE FIRE" y:y toView:scrollView color:[UIColor orangeColor]];
              y += 25;
              
              UIButton *btnInjMax = [self createBtn:@"INJECT FF MAX" color:[UIColor systemOrangeColor] y:y width:width tag:101];
              UIButton *btnInjNor = [self createBtn:@"INJECT FF THƯỜNG" color:[UIColor systemRedColor] y:y + 42 width:width tag:102];
              [scrollView addSubview:btnInjMax];
              [scrollView addSubview:btnInjNor];
              y += 92;
              
              // Section 2: Chuyển ứng dụng Mở Game
              [self addSectionTitle:@"🎮 MỞ GAME TRỰC TIẾP" y:y toView:scrollView color:[UIColor systemCyanColor]];
              y += 25;
              
              UIButton *btnOpenMax = [self createBtn:@"MỞ FREE FIRE MAX" color:[UIColor systemPurpleColor] y:y width:width tag:201];
              UIButton *btnOpenNor = [self createBtn:@"MỞ FREE FIRE THƯỜNG" color:[UIColor systemBlueColor] y:y + 42 width:width tag:202];
              [scrollView addSubview:btnOpenMax];
              [scrollView addSubview:btnOpenNor];
              y += 92;
              
              // Section 3: Công cụ tối ưu
              [self addSectionTitle:@"🎯 TỐI ƯU & NHẸ TÂM PRO" y:y toView:scrollView color:[UIColor systemGreenColor]];
              y += 25;
              
              UIButton *btnNheTam = [self createBtn:@"🎯 KÍCH HOẠT NHẸ TÂM (ÊM TÂM)" color:[UIColor colorWithRed:0.00 green:0.70 blue:0.30 alpha:1.0] y:y width:width tag:301];
              UIButton *btnFixLag = [self createBtn:@"⚡ FIX LAG & FIX SIÊU LAG" color:[UIColor colorWithRed:0.10 green:0.60 blue:0.80 alpha:1.0] y:y + 42 width:width tag:302];
              [scrollView addSubview:btnNheTam];
              [scrollView addSubview:btnFixLag];
              y += 100;
              
              scrollView.contentSize = CGSizeMake(width, y);
          }

          - (void)addSectionTitle:(NSString *)title y:(CGFloat)y toView:(UIView *)parent color:(UIColor *)color {
              UILabel *label = [[UILabel alloc] initWithFrame:CGRectMake(20, y, parent.bounds.size.width - 40, 20)];
              label.text = title;
              label.font = [UIFont systemFontOfSize:13 weight:UIFontWeightBold];
              label.textColor = color;
              [parent addSubview:label];
          }

          - (UIButton *)createBtn:(NSString *)title color:(UIColor *)color y:(CGFloat)y width:(CGFloat)width tag:(NSInteger)tag {
              UIButton *btn = [UIButton buttonWithType:UIButtonTypeSystem];
              btn.frame = CGRectMake(20, y, width - 40, 36);
              btn.tag = tag;
              [btn setTitle:title forState:UIControlStateNormal];
              btn.titleLabel.font = [UIFont systemFontOfSize:14 weight:UIFontWeightBold];
              [btn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              btn.backgroundColor = color;
              btn.layer.cornerRadius = 8;
              [btn addTarget:self action:@selector(handleAction:) forControlEvents:UIControlEventTouchUpInside];
              return btn;
          }

          - (void)handleAction:(UIButton *)sender {
              if (sender.tag == 101 || sender.tag == 102) {
                  // Chạy Inject 1% -> 100%
                  self.currentInjectName = sender.currentTitle;
                  self.currentProgress = 0.0;
                  self.progressView.progress = 0.0;
                  [self.injectTimer invalidate];
                  self.injectTimer = [NSTimer scheduledTimerWithTimeInterval:0.03 target:self selector:@selector(updateProgress) userInfo:nil repeats:YES];
              } else if (sender.tag == 201) {
                  // Mở FF Max
                  NSURL *url = [NSURL URLWithString:@"freefiremax://"];
                  if ([[UIApplication sharedApplication] canOpenURL:url]) {
                      [[UIApplication sharedApplication] openURL:url options:@{} completionHandler:nil];
                  } else {
                      [self showAlert:@"Không tìm thấy app Free Fire Max trên thiết bị!"];
                  }
              } else if (sender.tag == 202) {
                  // Mở FF Thường
                  NSURL *url = [NSURL URLWithString:@"freefire://"];
                  if ([[UIApplication sharedApplication] canOpenURL:url]) {
                      [[UIApplication sharedApplication] openURL:url options:@{} completionHandler:nil];
                  } else {
                      [self showAlert:@"Không tìm thấy app Free Fire Thường trên thiết bị!"];
                  }
              } else if (sender.tag == 301 || sender.tag == 302) {
                  // Tối ưu hệ thống (Giảm tải bộ nhớ đệm / Tăng ưu tiên FPS)
                  struct rlimit limit;
                  getrlimit(RLIMIT_NOFILE, &limit);
                  limit.rlim_cur = MIN(4096, limit.rlim_max);
                  setrlimit(RLIMIT_NOFILE, &limit);
                  
                  [self showAlert:[NSString stringWithFormat:@"Đã áp dụng thành công:\n%@", sender.currentTitle]];
              }
          }

          - (void)updateProgress {
              self.currentProgress += 0.02;
              self.progressView.progress = self.currentProgress;
              int percent = (int)(self.currentProgress * 100);
              self.progressLabel.text = [NSString stringWithFormat:@"Đang Inject: %d%%", percent];
              
              if (self.currentProgress >= 1.0) {
                  [self.injectTimer invalidate];
                  self.progressLabel.text = @"Trạng thái: Hoàn tất!";
                  [self showAlert:[NSString stringWithFormat:@"Inject thành công 100%:\n%@", self.currentInjectName]];
              }
          }

          - (void)showAlert:(NSString *)msg {
              UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"THÔNG BÁO" message:msg preferredStyle:UIAlertControllerStyleAlert];
              [alert addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];
              [self presentViewController:alert animated:YES completion:nil];
          }

          @end

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];
              self.window.rootViewController = [[MainViewController alloc] init];
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          EOF

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -isysroot $SDK_PATH -target arm64-apple-ios14.0 -framework UIKit -framework Foundation AppSource/main.m -o bindepzai123

          mkdir -p Payload/bindepzai123.app
          mv bindepzai123 Payload/bindepzai123.app/
          
          if [ -f "AppIcon.png" ]; then
              cp AppIcon.png Payload/bindepzai123.app/AppIcon60x60@2x.png
          fi

          cat << 'EOF' > Payload/bindepzai123.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>bindepzai123</string>
              <key>CFBundleIdentifier</key>
              <string>com.bindepzai123.app</string>
              <key>CFBundleName</key>
              <string>bindepzai123</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
              <key>LSApplicationQueriesSchemes</key>
              <array>
                  <string>freefire</string>
                  <string>freefiremax</string>
              </array>
          </dict>
          </plist>
          EOF

          zip -r bindepzai123.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindepzai123-ipa
          path: bindepzai123.ipa
