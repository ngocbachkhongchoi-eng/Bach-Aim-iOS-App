name: Build Full IPA bindepzai123

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile Native iOS Binary & Package IPA
        run: |
          mkdir -p AppSource
          cat << 'EOF' > AppSource/main.m
          #import <UIKit/UIKit.h>

          @interface MainViewController : UIViewController
          @end

          @implementation MainViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              
              // Nền Tối VIP Pro Style
              self.view.backgroundColor = [UIColor colorWithRed:0.08 green:0.09 blue:0.12 alpha:1.0];
              
              UIScrollView *scrollView = [[UIScrollView alloc] initWithFrame:self.view.bounds];
              scrollView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              [self.view addSubview:scrollView];
              
              CGFloat width = self.view.bounds.size.width;
              
              // Header Title VIP
              UILabel *headerLabel = [[UILabel alloc] initWithFrame:CGRectMake(20, 60, width - 40, 40)];
              headerLabel.text = @"⚡ BINĐẸPZAI123 VIP HUB ⚡";
              headerLabel.font = [UIFont systemFontOfSize:24 weight:UIFontWeightBlack];
              headerLabel.textColor = [UIColor colorWithRed:0.00 green:0.80 blue:1.00 alpha:1.0];
              headerLabel.textAlignment = NSTextAlignmentCenter;
              [scrollView addSubview:headerLabel];
              
              UILabel *subHeader = [[UILabel alloc] initWithFrame:CGRectMake(20, 100, width - 40, 25)];
              subHeader.text = @"Hệ Thống Tối Ưu & Inject Free Fire Cao Cấp";
              subHeader.font = [UIFont systemFontOfSize:14 weight:UIFontWeightMedium];
              subHeader.textColor = [UIColor lightGrayColor];
              subHeader.textAlignment = NSTextAlignmentCenter;
              [scrollView addSubview:subHeader];
              
              CGFloat currentY = 145;
              
              // 1. SECTION INJECT FF
              UILabel *sec1 = [[UILabel alloc] initWithFrame:CGRectMake(25, currentY, width - 50, 25)];
              sec1.text = @"🔥 CHỨC NĂNG INJECT GAME";
              sec1.font = [UIFont systemFontOfSize:15 weight:UIFontWeightBold];
              sec1.textColor = [UIColor orangeColor];
              [scrollView addSubview:sec1];
              currentY += 32;
              
              UIButton *btnInjMax = [self createVipBtnWithTitle:@"🚀 INJECT FREE FIRE MAX" color:[UIColor colorWithRed:1.00 green:0.40 blue:0.00 alpha:1.0] y:currentY width:width];
              [btnInjMax addTarget:self action:@selector(btnClicked:) forControlEvents:UIControlEventTouchUpInside];
              [scrollView addSubview:btnInjMax];
              currentY += 58;
              
              UIButton *btnInjNor = [self createVipBtnWithTitle:@"💥 INJECT FREE FIRE THƯỜNG" color:[UIColor colorWithRed:0.90 green:0.10 blue:0.20 alpha:1.0] y:currentY width:width];
              [btnInjNor addTarget:self action:@selector(btnClicked:) forControlEvents:UIControlEventTouchUpInside];
              [scrollView addSubview:btnInjNor];
              currentY += 70;
              
              // 2. SECTION VÀO GAME
              UILabel *sec2 = [[UILabel alloc] initWithFrame:CGRectMake(25, currentY, width - 50, 25)];
              sec2.text = @"🎮 MỞ GAME TRỰC TIẾP";
              sec2.font = [UIFont systemFontOfSize:15 weight:UIFontWeightBold];
              sec2.textColor = [UIColor systemCyanColor];
              [scrollView addSubview:sec2];
              currentY += 32;
              
              UIButton *btnOpenMax = [self createVipBtnWithTitle:@"▶ VÀO FREE FIRE MAX" color:[UIColor colorWithRed:0.50 green:0.15 blue:0.90 alpha:1.0] y:currentY width:width];
              [btnOpenMax addTarget:self action:@selector(btnClicked:) forControlEvents:UIControlEventTouchUpInside];
              [scrollView addSubview:btnOpenMax];
              currentY += 58;
              
              UIButton *btnOpenNor = [self createVipBtnWithTitle:@"▶ VÀO FREE FIRE THƯỜNG" color:[UIColor colorWithRed:0.10 green:0.50 blue:0.90 alpha:1.0] y:currentY width:width];
              [btnOpenNor addTarget:self action:@selector(btnClicked:) forControlEvents:UIControlEventTouchUpInside];
              [scrollView addSubview:btnOpenNor];
              currentY += 70;
              
              // 3. SECTION TỐI ƯU VÀ NHẸ TÂM PRO
              UILabel *sec3 = [[UILabel alloc] initWithFrame:CGRectMake(25, currentY, width - 50, 25)];
              sec3.text = @"🎯 CÔNG CỤ TỐI ƯU & NHẸ TÂM VIP PRO";
              sec3.font = [UIFont systemFontOfSize:15 weight:UIFontWeightBold];
              sec3.textColor = [UIColor systemGreenColor];
              [scrollView addSubview:sec3];
              currentY += 32;
              
              UIButton *btnNheTam = [self createVipBtnWithTitle:@"🎯 KÍCH HOẠT NHẸ TÂM PRO (SIÊU ÊM)" color:[UIColor colorWithRed:0.00 green:0.75 blue:0.35 alpha:1.0] y:currentY width:width];
              [btnNheTam addTarget:self action:@selector(btnClicked:) forControlEvents:UIControlEventTouchUpInside];
              [scrollView addSubview:btnNheTam];
              currentY += 58;
              
              UIButton *btnFixLag = [self createVipBtnWithTitle:@"⚡ FIX LAG & FIX SIÊU LAG (MAX FPS)" color:[UIColor colorWithRed:0.15 green:0.70 blue:0.85 alpha:1.0] y:currentY width:width];
              [btnFixLag addTarget:self action:@selector(btnClicked:) forControlEvents:UIControlEventTouchUpInside];
              [scrollView addSubview:btnFixLag];
              currentY += 80;
              
              scrollView.contentSize = CGSizeMake(width, currentY);
          }

          - (UIButton *)createVipBtnWithTitle:(NSString *)title color:(UIColor *)color y:(CGFloat)y width:(CGFloat)width {
              UIButton *btn = [UIButton buttonWithType:UIButtonTypeSystem];
              btn.frame = CGRectMake(20, y, width - 40, 50);
              [btn setTitle:title forState:UIControlStateNormal];
              btn.titleLabel.font = [UIFont systemFontOfSize:16 weight:UIFontWeightBold];
              [btn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              btn.backgroundColor = color;
              btn.layer.cornerRadius = 14;
              btn.layer.shadowColor = color.CGColor;
              btn.layer.shadowOffset = CGSizeMake(0, 4);
              btn.layer.shadowOpacity = 0.4;
              btn.layer.shadowRadius = 6;
              return btn;
          }

          - (void)btnClicked:(UIButton *)sender {
              UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"THÔNG BÁO VIP" message:[NSString stringWithFormat:@"Đã kích hoạt thành công:\n%@", sender.currentTitle] preferredStyle:UIAlertControllerStyleAlert];
              [alert addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];
              [self presentViewController:alert animated:YES completion:nil];
          }
          @end

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];
              self.window.rootViewController = [[MainViewController alloc] init];
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          EOF

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -isysroot $SDK_PATH -target arm64-apple-ios14.0 -framework UIKit -framework Foundation AppSource/main.m -o bindepzai123

          mkdir -p Payload/bindepzai123.app
          mv bindepzai123 Payload/bindepzai123.app/
          
          if [ -f "AppIcon.png" ]; then
              cp AppIcon.png Payload/bindepzai123.app/AppIcon60x60@2x.png
          fi

          cat << 'EOF' > Payload/bindepzai123.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>bindepzai123</string>
              <key>CFBundleIdentifier</key>
              <string>com.bindepzai123.app</string>
              <key>CFBundleName</key>
              <string>bindepzai123</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
          </dict>
          </plist>
          EOF

          zip -r bindepzai123.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindepzai123-ipa
          path: bindepzai123.ipa
