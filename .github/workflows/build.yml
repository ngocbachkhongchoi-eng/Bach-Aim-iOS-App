name: Build Full IPA bindepzai123

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create iOS App
        run: |
          mkdir -p AppSource
          cat << 'EOF' > AppSource/main.swift
          import UIKit

          class ViewController: UIViewController {
              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = .systemRed
                  
                  let titleLabel = UILabel()
                  titleLabel.text = "bindepzai123"
                  titleLabel.font = UIFont.boldSystemFont(ofSize: 32)
                  titleLabel.textColor = .white
                  titleLabel.textAlignment = .center
                  titleLabel.translatesAutoresizingMaskIntoConstraints = false
                  
                  let keyField = UITextField()
                  keyField.placeholder = "Nhập Key..."
                  keyField.isSecureTextEntry = true
                  keyField.borderStyle = .roundedRect
                  keyField.font = UIFont.systemFont(ofSize: 18)
                  keyField.translatesAutoresizingMaskIntoConstraints = false
                  
                  let loginBtn = UIButton(type: .system)
                  loginBtn.setTitle("ĐĂNG NHẬP", for: .normal)
                  loginBtn.titleLabel?.font = UIFont.boldSystemFont(ofSize: 18)
                  loginBtn.backgroundColor = .systemOrange
                  loginBtn.setTitleColor(.white, for: .normal)
                  loginBtn.layer.cornerRadius = 10
                  loginBtn.translatesAutoresizingMaskIntoConstraints = false
                  loginBtn.addTarget(self, action: #selector(handleLogin), for: .touchUpInside)
                  
                  let stackView = UIStackView(arrangedSubviews: [titleLabel, keyField, loginBtn])
                  stackView.axis = .vertical
                  stackView.spacing = 20
                  stackView.translatesAutoresizingMaskIntoConstraints = false
                  
                  view.addSubview(stackView)
                  
                  NSLayoutConstraint.activate([
                      keyField.heightAnchor.constraint(equalToConstant: 50),
                      loginBtn.heightAnchor.constraint(equalToConstant: 50),
                      stackView.leadingAnchor.constraint(equalTo: view.leadingAnchor, constant: 30),
                      stackView.trailingAnchor.constraint(equalTo: view.trailingAnchor, constant: -30),
                      stackView.centerYAnchor.constraint(equalTo: view.centerYAnchor)
                  ])
              }
              
              @objc func handleLogin() {
                  let mainVC = MainViewController()
                  mainVC.modalPresentationStyle = .fullScreen
                  present(mainVC, animated: true, completion: nil)
              }
          }

          class MainViewController: UIViewController {
              override func viewDidLoad() {
                  super.viewDidLoad()
                  view.backgroundColor = .systemBlue
                  
                  let label = UILabel()
                  label.text = "🔥 MENU FREE FIRE & IPA TOOLS 🔥"
                  label.font = UIFont.boldSystemFont(ofSize: 22)
                  label.textColor = .white
                  label.textAlignment = .center
                  label.numberOfLines = 0
                  label.translatesAutoresizingMaskIntoConstraints = false
                  
                  let btn1 = createButton(title: "Inject FF Max", color: .systemOrange)
                  let btn2 = createButton(title: "Inject FF Thường", color: .systemRed)
                  let btn3 = createButton(title: "Vào FF Max", color: .systemPurple)
                  let btn4 = createButton(title: "Vào FF Thường", color: .systemIndigo)
                  let btn5 = createButton(title: "⚡ Fix Lag / Siêu Lag / Nhẹ Tâm", color: .systemGreen)
                  
                  let stack = UIStackView(arrangedSubviews: [label, btn1, btn2, btn3, btn4, btn5])
                  stack.axis = .vertical
                  stack.spacing = 15
                  stack.translatesAutoresizingMaskIntoConstraints = false
                  
                  view.addSubview(stack)
                  
                  NSLayoutConstraint.activate([
                      stack.leadingAnchor.constraint(equalTo: view.leadingAnchor, constant: 20),
                      stack.trailingAnchor.constraint(equalTo: view.trailingAnchor, constant: -20),
                      stack.centerYAnchor.constraint(equalTo: view.centerYAnchor)
                  ])
              }
              
              func createButton(title: String, color: UIColor) -> UIButton {
                  let btn = UIButton(type: .system)
                  btn.setTitle(title, for: .normal)
                  btn.titleLabel?.font = UIFont.boldSystemFont(ofSize: 16)
                  btn.backgroundColor = color
                  btn.setTitleColor(.white, for: .normal)
                  btn.layer.cornerRadius = 10
                  btn.heightAnchor.constraint(equalToConstant: 45).isActive = true
                  return btn
              }
          }

          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  window?.rootViewController = ViewController()
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          EOF

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc -sdk $SDK_PATH -target arm64-apple-ios14.0 AppSource/main.swift -o bindepzai123

          mkdir -p Payload/bindepzai123.app
          mv bindepzai123 Payload/bindepzai123.app/
          
          if [ -f "AppIcon.png" ]; then
              cp AppIcon.png Payload/bindepzai123.app/AppIcon60x60@2x.png
          fi

          cat << 'EOF' > Payload/bindepzai123.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>bindepzai123</string>
              <key>CFBundleIdentifier</key>
              <string>com.bindepzai123.app</string>
              <key>CFBundleName</key>
              <string>bindepzai123</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
          </dict>
          </plist>
          EOF

          zip -r bindepzai123.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindepzai123-ipa
          path: bindepzai123.ipa
