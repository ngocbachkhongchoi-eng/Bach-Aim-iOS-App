name: Build Full IPA bindepzai123

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create iOS Swift App with Pro UI & FF Menu
        run: |
          mkdir -p AppSource
          cat << 'EOF' > AppSource/main.swift
          import UIKit
          import SwiftUI

          struct LoginView: View {
              @State private var keyInput = ""
              @State private var isLoggedIn = false
              @State private var showError = false

              var body: some View {
                  if isLoggedIn {
                      MainView()
                  } else {
                      ZStack {
                          LinearGradient(gradient: Gradient(colors: [Color(red: 0.8, green: 0.1, blue: 0.1), Color(red: 0.4, green: 0.0, blue: 0.0)]), startPoint: .top, endPoint: .bottom)
                              .edgesIgnoringSafeArea(.all)
                          
                          VStack(spacing: 30) {
                              VStack(spacing: 8) {
                                  Image(systemName: "flame.fill")
                                      .resizable()
                                      .aspectRatio(contentMode: .fit)
                                      .frame(width: 70, height: 70)
                                      .foregroundColor(.purple)
                                      .shadow(color: .purple, radius: 10)
                                  
                                  Text("BINDÉPZAI 123")
                                      .font(.system(size: 34, weight: .black, design: .rounded))
                                      .foregroundColor(.white)
                                      .shadow(color: .black.opacity(0.5), radius: 5, x: 0, y: 3)
                                  
                                  Text("VIP GAMING & IPA HUB")
                                      .font(.subheadline)
                                      .bold()
                                      .foregroundColor(.white.opacity(0.8))
                              }
                              
                              VStack(spacing: 20) {
                                  SecureField("Nhập Key Bản Quyền...", text: $keyInput)
                                      .padding(.vertical, 16)
                                      .padding(.horizontal, 16)
                                      .background(Color.white)
                                      .cornerRadius(14)
                                      .font(.system(size: 18, weight: .bold))
                                      .foregroundColor(.black)
                                      .autocapitalization(.none)
                                      .shadow(radius: 3)
                                  
                                  Button(action: {
                                      if keyInput == "bindepzai123" {
                                          isLoggedIn = true
                                      } else {
                                          showError = true
                                      }
                                  }) {
                                      Text("XÁC NHẬN ĐĂNG NHẬP")
                                          .font(.system(size: 18, weight: .bold))
                                          .foregroundColor(.white)
                                          .frame(maxWidth: .infinity)
                                          .padding(.vertical, 16)
                                          .background(LinearGradient(gradient: Gradient(colors: [Color.orange, Color.red]), startPoint: .leading, endPoint: .trailing))
                                          .cornerRadius(14)
                                          .shadow(color: .black.opacity(0.4), radius: 5, x: 0, y: 3)
                                  }
                                  
                                  if showError {
                                      Text("⚠️ Key không chính xác, thử lại nhé!")
                                          .font(.subheadline)
                                          .bold()
                                          .foregroundColor(.yellow)
                                  }
                              }
                              .padding(25)
                              .background(Color.black.opacity(0.4))
                              .cornerRadius(22)
                              .padding(.horizontal, 20)
                          }
                      }
                  }
              }
          }

          struct MainView: View {
              @State private var importedFiles: [String] = ["bindepzai123_v1.ipa"]
              @State private var certStatus = "Chưa có chứng chỉ"
              @State private var showAlert = false
              @State private var alertMessage = ""
              
              @State private var isFixLagEnabled = false
              @State private var isFixSuperLagEnabled = false
              @State private var isNheTamEnabled = false

              init() {
                  UITableView.appearance().backgroundColor = .clear
              }

              var body: some View {
                  NavigationView {
                      ZStack {
                          Color.blue.edgesIgnoringSafeArea(.all)
                          List {
                              Section(header: Text("🔥 MENU FREE FIRE (MAX & THƯỜNG)").foregroundColor(.white).bold()) {
                                  HStack(spacing: 12) {
                                      Button(action: {
                                          alertMessage = "Đã Inject thành công FF Max!"
                                          showAlert = true
                                      }) {
                                          Text("Inject FF Max")
                                              .bold()
                                              .frame(maxWidth: .infinity)
                                              .padding(12)
                                              .background(Color.orange)
                                              .foregroundColor(.white)
                                              .cornerRadius(10)
                                      }
                                      
                                      Button(action: {
                                          alertMessage = "Đã Inject thành công FF Thường!"
                                          showAlert = true
                                      }) {
                                          Text("Inject FF Thường")
                                              .bold()
                                              .frame(maxWidth: .infinity)
                                              .padding(12)
                                              .background(Color.red)
                                              .foregroundColor(.white)
                                              .cornerRadius(10)
                                      }
                                  }
                                  
                                  HStack(spacing: 12) {
                                      Button(action: {
                                          alertMessage = "Đang khởi chạy Free Fire Max..."
                                          showAlert = true
                                      }) {
                                          Label("Vào FF Max", systemImage: "play.fill")
                                              .bold()
                                              .frame(maxWidth: .infinity)
                                              .padding(12)
                                              .background(Color.purple)
                                              .foregroundColor(.white)
                                              .cornerRadius(10)
                                      }
                                      
                                      Button(action: {
                                          alertMessage = "Đang khởi chạy Free Fire Thường..."
                                          showAlert = true
                                      }) {
                                          Label("Vào FF Thường", systemImage: "play.circle.fill")
                                              .bold()
                                              .frame(maxWidth: .infinity)
                                              .padding(12)
                                              .background(Color.indigo)
                                              .foregroundColor(.white)
                                              .cornerRadius(10)
                                      }
                                  }
                                  
                                  Toggle("⚡ Fix Lag", isOn: $isFixLagEnabled)
                                  Toggle("🚀 Fix Siêu Lag (Max FPS)", isOn: $isFixSuperLagEnabled)
                                  Toggle("🎯 Nhẹ Tâm (Ổn định tâm)", isOn: $isNheTamEnabled)
                              }
                              
                              Section(header: Text("Quản lý Chứng chỉ").foregroundColor(.white)) {
                                  HStack {
                                      Text("Trạng thái:")
                                      Spacer()
                                      Text(certStatus).foregroundColor(.gray)
                                  }
                                  Button("Nhập Chứng Chỉ (.p12 / .mobileprovision)") {
                                      alertMessage = "Tính năng nhập chứng chỉ đã sẵn sàng."
                                      showAlert = true
                                  }
                              }
                              
                              Section(header: Text("Quản lý & Nhập File IPA").foregroundColor(.white)) {
                                  ForEach(importedFiles, id: \.self) { file in
                                      HStack {
                                          Image(systemName: "cube.box")
                                          Text(file)
                                          Spacer()
                                          Button("Cài đặt") {
                                              alertMessage = "Đang xử lý cài đặt \(file)..."
                                              showAlert = true
                                          }
                                      }
                                  }
                                  Button("Thêm / Nhập File IPA mới") {
                                      let newFile = "app_moi_\(importedFiles.count + 1).ipa"
                                      importedFiles.append(newFile)
                                  }
                              }
                          }
                      }
                      .navigationTitle("bindepzai123 - Gaming Hub")
                      .navigationBarTitleDisplayMode(.inline)
                  }
                  .alert(isPresented: $showAlert) {
                      Alert(title: Text("Thông báo"), message: Text(alertMessage), dismissButton: .default(Text("OK")))
                  }
              }
          }

          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let window = UIWindow(frame: UIScreen.main.bounds)
                  window.rootViewController = UIHostingController(rootView: LoginView())
                  self.window = window
                  window.makeKeyAndVisible()
                  return true
              }
          }

          UIApplicationMain(
              CommandLine.argc,
              CommandLine.unsafeArgv,
              nil,
              NSStringFromClass(AppDelegate.self)
          )
          EOF

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc -sdk $SDK_PATH -target arm64-apple-ios14.0 AppSource/main.swift -o bindepzai123

          mkdir -p Payload/bindepzai123.app
          mv bindepzai123 Payload/bindepzai123.app/
          
          # Tải icon nếu người dùng đã upload, hoặc sử dụng icon mặc định
          if [ -f "AppIcon.png" ]; then
              cp AppIcon.png Payload/bindepzai123.app/AppIcon60x60@2x.png
          fi

          cat << 'EOF' > Payload/bindepzai123.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>bindepzai123</string>
              <key>CFBundleIdentifier</key>
              <string>com.bindepzai123.app</string>
              <key>CFBundleName</key>
              <string>bindepzai123</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleIcons</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon60x60</string>
                      </array>
                  </dict>
              </dict>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
          </dict>
          </plist>
          EOF

          zip -r bindepzai123.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindepzai123-ipa
          path: bindepzai123.ipa
