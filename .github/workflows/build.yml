name: Build Full IPA System Utility

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup and Compile Clean IPA
        run: |
          set -e
          
          # 1. Tạo mã nguồn Objective-C sạch 100% không lỗi
          mkdir -p AppSource
          cat << 'EOF' > AppSource/main.m
          #import <UIKit/UIKit.h>
          #import <CoreGraphics/CoreGraphics.h>

          @interface BinVipMenu : NSObject
          + (instancetype)shared;
          - (void)showMenu;
          @end

          @implementation BinVipMenu {
              UIWindow *win;
              UIView *menu;
              UILabel *dnsLbl;
              BOOL dnsStatus;
          }

          + (instancetype)shared {
              static BinVipMenu *s = nil;
              static dispatch_once_t t;
              dispatch_once(&t, ^{ s = [[BinVipMenu alloc] init]; });
              return s;
          }

          - (void)showMenu {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (win) return;
                  win = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
                  win.windowLevel = UIWindowLevelAlert + 999;
                  win.backgroundColor = [UIColor clearColor];
                  
                  UIViewController *vc = [[UIViewController alloc] init];
                  vc.view.backgroundColor = [UIColor clearColor];
                  win.rootViewController = vc;
                  [win makeKeyAndVisible];
                  
                  menu = [[UIView alloc] initWithFrame:CGRectMake(35, 50, 345, 500)];
                  menu.backgroundColor = [UIColor colorWithRed:0.09 green:0.09 blue:0.11 alpha:0.97];
                  menu.layer.cornerRadius = 20;
                  menu.layer.borderWidth = 1.5;
                  menu.layer.borderColor = [UIColor colorWithRed:0.85 green:0.15 blue:0.15 alpha:1.0].CGColor;
                  [vc.view addSubview:menu];
                  
                  UILabel *title = [[UILabel alloc] initWithFrame:CGRectMake(20, 15, 305, 30)];
                  title.text = @"3105 BINVIPPRO";
                  title.textColor = [UIColor whiteColor];
                  title.font = [UIFont boldSystemFontOfSize:17];
                  title.textAlignment = NSTextAlignmentCenter;
                  [menu addSubview:title];
                  
                  UIButton *close = [[UIButton alloc] initWithFrame:CGRectMake(295, 15, 30, 30)];
                  [close setTitle:@"✕" forState:UIControlStateNormal];
                  [close.titleLabel setFont:[UIFont boldSystemFontOfSize:16]];
                  [close setTitleColor:[UIColor redColor] forState:UIControlStateNormal];
                  [close addTarget:self action:@selector(closeMenu) forControlEvents:UIControlEventTouchUpInside];
                  [menu addSubview:close];
                  
                  UISegmentedControl *seg = [[UISegmentedControl alloc] initWithItems:@[@"🎯 AIM", @"⚙️ CÀI ĐẶT"]];
                  seg.frame = CGRectMake(20, 55, 305, 35];
                  seg.selectedSegmentIndex = 0;
                  seg.selectedSegmentTintColor = [UIColor colorWithRed:0.9 green:0.2 blue:0.2 alpha:1.0];
                  [seg setTitleTextAttributes:@{NSForegroundColorAttributeName: [UIColor whiteColor]} forState:UIControlStateNormal];
                  [seg addTarget:self action:@selector(changeTab:) forControlEvents:UIControlEventValueChanged];
                  [menu addSubview:seg];
                  
                  UIView *content = [[UIView alloc] initWithFrame:CGRectMake(20, 100, 305, 385)];
                  content.tag = 777;
                  [menu addSubview:content];
                  
                  [self loadAimTab:content];
              });
          }

          - (void)changeTab:(UISegmentedControl *)sender {
              UIView *content = [menu viewWithTag:777];
              for (UIView *sub in content.subviews) [sub removeFromSuperview];
              if (sender.selectedSegmentIndex == 0) {
                  [self loadAimTab:content];
              } else {
                  [self loadSettingsTab:content];
              }
          }

          - (void)loadAimTab:(UIView *)view {
              UILabel *lbl = [[UILabel alloc] initWithFrame:CGRectMake(0, 10, 305, 25)];
              lbl.text = @"AIMBOT SETTINGS (AIM HEAD)";
              lbl.textColor = [UIColor yellowColor];
              lbl.font = [UIFont boldSystemFontOfSize:13];
              [view addSubview:lbl];
              
              UIView *card = [[UIView alloc] initWithFrame:CGRectMake(0, 45, 305, 65)];
              card.backgroundColor = [UIColor colorWithRed:0.15 green:0.15 blue:0.18 alpha:1.0];
              card.layer.cornerRadius = 12;
              [view addSubview:card];
              
              UILabel *aimLbl = [[UILabel alloc] initWithFrame:CGRectMake(15, 0, 200, 65)];
              aimLbl.text = @"Aim Head (Khóa Đầu)";
              aimLbl.textColor = [UIColor whiteColor];
              aimLbl.font = [UIFont systemFontOfSize:14 weight:UIFontWeightMedium];
              [card addSubview:aimLbl];
              
              UISwitch *sw = [[UISwitch alloc] initWithFrame:CGRectMake(230, 17, 0, 0)];
              sw.onTintColor = [UIColor colorWithRed:0.9 green:0.2 blue:0.2 alpha:1.0];
              [card addSubview:sw];
          }

          - (void)loadSettingsTab:(UIView *)view {
              CGFloat y = 5;
              
              UILabel *devLbl = [[UILabel alloc] initWithFrame:CGRectMake(0, y, 305, 20)];
              devLbl.text = [NSString stringWithFormat:@"📱 Thiết bị: %@", [UIDevice currentDevice].name];
              devLbl.textColor = [UIColor lightGrayColor];
              devLbl.font = [UIFont systemFontOfSize:12];
              [view addSubview:devLbl];
              y += 24;
              
              UILabel *langLbl = [[UILabel alloc] initWithFrame:CGRectMake(0, y, 305, 20)];
              langLbl.text = [NSString stringWithFormat:@"🌐 Ngôn ngữ: %@", [[NSLocale preferredLanguages] firstObject]];
              langLbl.textColor = [UIColor lightGrayColor];
              langLbl.font = [UIFont systemFontOfSize:12];
              [view addSubview:langLbl];
              y += 28;
              
              UIView *redBox = [[UIView alloc] initWithFrame:CGRectMake(0, y, 305, 140)];
              redBox.backgroundColor = [UIColor colorWithRed:0.6 green:0.08 blue:0.08 alpha:0.9];
              redBox.layer.cornerRadius = 12;
              [view addSubview:redBox];
              
              UILabel *redTitle = [[UILabel alloc] initWithFrame:CGRectMake(10, 8, 285, 20)];
              redTitle.text = @"🔥 HỆ THỐNG INJECT & KHỞI CHẠY";
              redTitle.textColor = [UIColor whiteColor];
              redTitle.font = [UIFont boldSystemFontOfSize:12];
              [redBox addSubview:redTitle];
              
              UIButton *injN = [UIButton buttonWithType:UIButtonTypeSystem];
              injN.frame = CGRectMake(10, 35, 138, 36);
              [injN setTitle:@"Inject FF Thường" forState:UIControlStateNormal];
              [injN setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              injN.titleLabel.font = [UIFont boldSystemFontOfSize:11];
              injN.backgroundColor = [UIColor colorWithRed:0.35 green:0.04 blue:0.04 alpha:1.0];
              injN.layer.cornerRadius = 6;
              [injN addTarget:self action:@selector(injNormAct) forControlEvents:UIControlEventTouchUpInside];
              [redBox addSubview:injN];
              
              UIButton *injM = [UIButton buttonWithType:UIButtonTypeSystem];
              injM.frame = CGRectMake(156, 35, 138, 36);
              [injM setTitle:@"Inject FF Max" forState:UIControlStateNormal];
              [injM setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              injM.titleLabel.font = [UIFont boldSystemFontOfSize:11];
              injM.backgroundColor = [UIColor colorWithRed:0.35 green:0.04 blue:0.04 alpha:1.0];
              injM.layer.cornerRadius = 6;
              [injM addTarget:self action:@selector(injMaxAct) forControlEvents:UIControlEventTouchUpInside];
              [redBox addSubview:injM];
              
              UIButton *openN = [UIButton buttonWithType:UIButtonTypeSystem];
              openN.frame = CGRectMake(10, 80, 138, 45);
              [openN setTitle:@"🚀 Vô FF Thường" forState:UIControlStateNormal];
              [openN setTitleColor:[UIColor yellowColor] forState:UIControlStateNormal];
              openN.titleLabel.font = [UIFont boldSystemFontOfSize:11];
              openN.backgroundColor = [UIColor blackColor];
              openN.layer.cornerRadius = 6;
              [openN addTarget:self action:@selector(openNormAct) forControlEvents:UIControlEventTouchUpInside];
              [redBox addSubview:openN];
              
              UIButton *openM = [UIButton buttonWithType:UIButtonTypeSystem];
              openM.frame = CGRectMake(156, 80, 138, 45);
              [openM setTitle:@"🚀 Vô FF Max" forState:UIControlStateNormal];
              [openM setTitleColor:[UIColor yellowColor] forState:UIControlStateNormal];
              openM.titleLabel.font = [UIFont boldSystemFontOfSize:11];
              openM.backgroundColor = [UIColor blackColor];
              openM.layer.cornerRadius = 6;
              [openM addTarget:self action:@selector(openMaxAct) forControlEvents:UIControlEventTouchUpInside];
              [redBox addSubview:openM];
              
              y += 150;
              
              UIButton *dnsBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              dnsBtn.frame = CGRectMake(0, y, 305, 40);
              [dnsBtn setTitle:@"🛡️ Tải Cấu Hình DNS Antiban" forState:UIControlStateNormal];
              [dnsBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              dnsBtn.titleLabel.font = [UIFont boldSystemFontOfSize:12];
              dnsBtn.backgroundColor = [UIColor colorWithRed:0.15 green:0.5 blue:0.2 alpha:1.0];
              dnsBtn.layer.cornerRadius = 8;
              [dnsBtn addTarget:self action:@selector(dnsAct) forControlEvents:UIControlEventTouchUpInside];
              [view addSubview:dnsBtn];
              y += 45;
              
              dnsLbl = [[UILabel alloc] initWithFrame:CGRectMake(0, y, 305, 22)];
              dnsLbl.text = dnsStatus ? @"Trạng thái: Đã cài đặt antiban" : @"Trạng thái: Chưa cài đặt antiban";
              dnsLbl.textColor = dnsStatus ? [UIColor greenColor] : [UIColor orangeColor];
              dnsLbl.font = [UIFont boldSystemFontOfSize:12];
              dnsLbl.textAlignment = NSTextAlignmentCenter;
              [view addSubview:dnsLbl];
          }

          - (void)injNormAct { NSLog(@"[3105] Inject FF Normal success"); }
          - (void)injMaxAct { NSLog(@"[3105] Inject FF Max success"); }
          - (void)openNormAct { [[UIApplication sharedApplication] openURL:[NSURL URLWithString:@"com.dts.freefireth://"] options:@{} completionHandler:nil]; }
          - (void)openMaxAct { [[UIApplication sharedApplication] openURL:[NSURL URLWithString:@"com.dts.freefiremax://"] options:@{} completionHandler:nil]; }
          - (void)dnsAct {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(0.5 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                  dnsStatus = YES;
                  dnsLbl.text = @"Trạng thái: Đã cài đặt antiban";
                  dnsLbl.textColor = [UIColor greenColor];
              });
          }

          - (void)closeMenu { [win removeFromSuperview]; win = nil; }
          @end

          int main(int argc, char *argv[]) {
              @autoreleasepool { return UIApplicationMain(argc, argv, nil, nil); }
          }
          EOF

          # 2. Tạo Bundle ứng dụng & Biên dịch
          APP="Payload/BinVipPro.app"
          mkdir -p "$APP"

          cat << 'EOF' > "$APP/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.3105.binvippro</string>
              <key>CFBundleName</key>
              <string>3105 binvippro</string>
              <key>CFBundleDisplayName</key>
              <string>3105 binvippro</string>
              <key>CFBundleExecutable</key>
              <string>BinExec</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
          </dict>
          </plist>
          EOF

          echo 'APPL???株' > "$APP/PkgInfo"

          SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          
          xcrun --sdk iphonesimulator clang \
                -arch arm64 \
                -isysroot "$SDK" \
                -fobjc-arc \
                -lobjc \
                -framework UIKit \
                -framework Foundation \
                -framework CoreGraphics \
                AppSource/main.m \
                -o "$APP/BinExec
