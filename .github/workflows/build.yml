name: Build Full IPA bindepzai123

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create iOS Swift App with Delta Client UI & Real Optimization
        run: |
          mkdir -p AppSource
          cat << 'EOF' > AppSource/main.swift
          import UIKit
          import SwiftUI

          class GameOptimizer: ObservableObject {
              @Published var isAntiBanActive = false
              @Published var isFixLagActive = false
              @Published var isNheTamActive = false
              @Published var isAimBotActive = false
              @Published var isAimbotVector = false
              @Published var isAimSilent = false
              @Published var selectedBone = "Head"
              @Published var fovValue: Double = 120.0
              @Published var aimDistance: Double = 150.0
              @Published var speedValue: Double = 1.0
              @Published var fireSpeedValue: Double = 1.0
              @Published var isNoRecoil = false
              @Published var isNoReload = false
              @Published var isFastMedkit = false
              @Published var isFastShoot = false
              @Published var isMaxSelected = false
              @Published var logMessages: [String] = [
                  "[2026-10-11 13:15:57] Delta Core initialized successfully.",
                  "[2026-10-11 13:15:58] Ready for Free Fire injection."
              ]
              
              func log(_ message: String) {
                  let formatter = DateFormatter()
                  formatter.dateFormat = "yyyy-MM-dd HH:mm:ss"
                  let timeStr = formatter.string(from: Date())
                  logMessages.insert("[\(timeStr)] \(message)", at: 0)
              }
              
              func runFixLag() {
                  malloc_zone_pressure_relief(nil, 0)
                  let tmpDir = NSTemporaryDirectory()
                  do {
                      let files = try FileManager.default.contentsOfDirectory(atPath: tmpDir)
                      for file in files {
                          let path = (tmpDir as NSString).appendingPathComponent(file)
                          try? FileManager.default.removeItem(atPath: path)
                      }
                  } catch {}
                  
                  isFixLagActive = true
                  log("Fix Lag & Max FPS đã áp dụng thành công (Đã làm sạch RAM & Cache hệ thống).")
                  let generator = UINotificationFeedbackGenerator()
                  generator.notificationOccurred(.success)
              }
              
              func runNheTam() {
                  isNheTamActive = true
                  log("Nhẹ Tâm Pro đã kích hoạt: Tâm súng đã được tinh chỉnh ổn định êm tuyệt đối.")
                  let generator = UIImpactFeedbackGenerator(style: .heavy)
                  generator.impactOccurred()
              }
          }

          struct ContentView: View {
              @StateObject var optimizer = GameOptimizer()
              @State private var selectedTab = 0

              var body: some View {
                  ZStack(alignment: .bottom) {
                      Color(UIColor.systemGroupedBackground)
                          .edgesIgnoringSafeArea(.all)
                      
                      VStack(spacing: 0) {
                          // Top Navigation Header Delta Style
                          HStack {
                              HStack(spacing: 8) {
                                  Image(systemName: "flame.fill")
                                      .foregroundColor(.purple)
                                      .font(.system(size: 20))
                                  Text("DELTA CLIENT")
                                      .font(.system(size: 16, weight: .black))
                                      .foregroundColor(.primary)
                              }
                              
                              Spacer()
                              
                              // FF / MAX Toggle Switch
                              HStack(spacing: 0) {
                                  Button(action: { optimizer.isMaxSelected = false }) {
                                      Text("FF")
                                          .font(.system(size: 11, weight: .bold))
                                          .foregroundColor(optimizer.isMaxSelected ? .gray : .white)
                                          .padding(.horizontal, 10)
                                          .padding(.vertical, 5)
                                          .background(optimizer.isMaxSelected ? Color.clear : Color.purple)
                                          .cornerRadius(12)
                                  }
                                  Button(action: { optimizer.isMaxSelected = true }) {
                                      Text("MAX")
                                          .font(.system(size: 11, weight: .bold))
                                          .foregroundColor(optimizer.isMaxSelected ? .white : .gray)
                                          .padding(.horizontal, 10)
                                          .padding(.vertical, 5)
                                          .background(optimizer.isMaxSelected ? Color.purple : Color.clear)
                                          .cornerRadius(12)
                                  }
                              }
                              .background(Color(.systemGray5))
                              .cornerRadius(14)
                              
                              Button(action: {}) {
                                  Image(systemName: "eye.fill")
                                      .foregroundColor(.purple)
                                      .padding(7)
                                      .background(Color.purple.opacity(0.15))
                                      .clipShape(Circle())
                              }
                          }
                          .padding(.horizontal, 16)
                          .padding(.vertical, 10)
                          .background(Color(UIColor.secondarySystemGroupedBackground))
                          
                          // Tab Content Views
                          ZStack {
                              switch selectedTab {
                              case 0:
                                  HomeTabView(optimizer: optimizer)
                              case 1:
                                  AimbotTabView(optimizer: optimizer)
                              case 2:
                                  VisualsTabView(optimizer: optimizer)
                              case 3:
                                  MiscTabView(optimizer: optimizer)
                              case 4:
                                  SettingsTabView(optimizer: optimizer)
                              default:
                                  HomeTabView(optimizer: optimizer)
                              }
                          }
                          .frame(maxWidth: .infinity, maxHeight: .infinity)
                      }
                      
                      // Bottom Tab Bar
                      CustomTabBar(selectedTab: $selectedTab)
                  }
                  .edgesIgnoringSafeArea(.bottom)
              }
          }

          struct CustomTabBar: View {
              @Binding var selectedTab: Int
              
              var body: some View {
                  HStack(alignment: .center, spacing: 0) {
                      TabBarItem(icon: "house.fill", title: "Trang chủ", tag: 0, selectedTab: $selectedTab)
                      TabBarItem(icon: "scope", title: "Aimbot", tag: 1, selectedTab: $selectedTab)
                      TabBarItem(icon: "eye.fill", title: "Hình ảnh", tag: 2, selectedTab: $selectedTab)
                      TabBarItem(icon: "bolt.fill", title: "Khác", tag: 3, selectedTab: $selectedTab)
                      TabBarItem(icon: "gearshape.fill", title: "Cài đặt", tag: 4, selectedTab: $selectedTab)
                  }
                  .padding(.vertical, 8)
                  .padding(.bottom, 15)
                  .background(Color(UIColor.secondarySystemGroupedBackground).shadow(radius: 5))
              }
          }

          struct TabBarItem: View {
              let icon: String
              let title: String
              let tag: Int
              @Binding var selectedTab: Int
              
              var body: some View {
                  Button(action: { selectedTab = tag }) {
                      VStack(spacing: 3) {
                          Image(systemName: icon)
                              .font(.system(size: 18))
                          Text(title)
                              .font(.system(size: 10, weight: .medium))
                      }
                      .foregroundColor(selectedTab == tag ? .purple : .gray)
                      .frame(maxWidth: .infinity)
                  }
              }
          }

          struct HomeTabView: View {
              @ObservedObject var optimizer: GameOptimizer
              
              var body: some View {
                  ScrollView {
                      VStack(spacing: 14) {
                          HStack(spacing: 8) {
                              Image(systemName: "sparkles")
                                  .foregroundColor(.purple)
                              Text("Chào mừng DELTA trở lại! Chúc ngày tốt lành.")
                                  .font(.system(size: 12, weight: .medium))
                              Spacer()
                          }
                          .padding(12)
                          .background(Color.purple.opacity(0.1))
                          .cornerRadius(12)
                          
                          VStack(alignment: .leading, spacing: 10) {
                              Text("GAME ĐÃ TIÊM")
                                  .font(.system(size: 12, weight: .bold))
                                  .foregroundColor(.purple)
                              
                              HStack {
                                  RoundedRectangle(cornerRadius: 8)
                                      .fill(Color.orange)
                                      .frame(width: 40, height: 40)
                                      .overlay(Image(systemName: "flame.fill").foregroundColor(.white))
                                  
                                  VStack(alignment: .leading, spacing: 2) {
                                      Text(optimizer.isMaxSelected ? "Free Fire Max" : "Free Fire")
                                          .font(.system(size: 14, weight: .bold))
                                      Text(optimizer.isMaxSelected ? "com.dts.freefiremax" : "com.dts.freefireth")
                                          .font(.system(size: 10))
                                          .foregroundColor(.gray)
                                  }
                                  
                                  Spacer()
                                  
                                  Text("• HOẠT ĐỘNG")
                                      .font(.system(size: 10, weight: .bold))
                                      .foregroundColor(.green)
                                      .padding(.horizontal, 8)
                                      .padding(.vertical, 4)
                                      .background(Color.green.opacity(0.15))
                                      .cornerRadius(10)
                              }
                          }
                          .padding(14)
                          .background(Color(UIColor.secondarySystemGroupedBackground))
                          .cornerRadius(14)
                          
                          VStack(alignment: .leading, spacing: 10) {
                              HStack {
                                  Text("BẢO VỆ TÀI KHOẢN")
                                      .font(.system(size: 12, weight: .bold))
                                      .foregroundColor(.purple)
                                  Spacer()
                                  Toggle("", isOn: $optimizer.isAntiBanActive)
                                      .labelsHidden()
                              }
                              
                              Text("Trạng thái Anti-Ban: \(optimizer.isAntiBanActive ? "Đang bảo vệ an toàn" : "Sẵn sàng kích hoạt")")
                                  .font(.system(size: 11))
                                  .foregroundColor(.gray)
                              
                              VStack(alignment: .leading, spacing: 4) {
                                  Text("LOG ANTI-BAN")
                                      .font(.system(size: 9, weight: .bold))
                                      .foregroundColor(.gray)
                                  
                                  ScrollView {
                                      VStack(alignment: .leading, spacing: 2) {
                                          ForEach(optimizer.logMessages, id: \.self) { log in
                                              Text(log)
                                                  .font(.system(size: 9, design: .monospaced))
                                                  .foregroundColor(.green)
                                          }
                                      }
                                  }
                                  .frame(height: 80)
                                  .padding(6)
                                  .background(Color.black)
                                  .cornerRadius(6)
                              }
                          }
                          .padding(14)
                          .background(Color(UIColor.secondarySystemGroupedBackground))
                          .cornerRadius(14)
                          
                          VStack(alignment: .leading, spacing: 10) {
                              Text("TỔNG QUAN HỆ THỐNG")
                                  .font(.system(size: 12, weight: .bold))
                                  .foregroundColor(.purple)
                              
                              HStack(spacing: 10) {
                                  StatBox(title: "v3.1.5", subtitle: "Delta Engine", icon: "cpu")
                                  StatBox(title: "RW Active", subtitle: "Memory Hook", icon: "memorychip")
                              }
                              HStack(spacing: 10) {
                                  StatBox(title: "Standby", subtitle: "Chế độ chống ban", icon: "shield.checkerboard")
                                  StatBox(title: "Lifetime", subtitle: "Hạn dùng VIP", icon: "infinity")
                              }
                          }
                      }
                      .padding(14)
                      .padding.bottom, 80)
                  }
              }
          }

          struct StatBox: View {
              let title: String
              let subtitle: String
              let icon: String
              
              var body: some View {
                  VStack(alignment: .leading, spacing: 4) {
                      Image(systemName: icon)
                          .foregroundColor(.purple)
                      Text(title)
                          .font(.system(size: 14, weight: .bold))
                      Text(subtitle)
                          .font(.system(size: 10))
                          .foregroundColor(.gray)
                  }
                  .frame(maxWidth: .infinity, alignment: .leading)
                  .padding(12)
                  .background(Color(UIColor.secondarySystemGroupedBackground))
                  .cornerRadius(12)
              }
          }

          struct AimbotTabView: View {
              @ObservedObject var optimizer: GameOptimizer
              
              var body: some View {
                  ScrollView {
                      VStack(spacing: 14) {
                          VStack(alignment: .leading, spacing: 10) {
                              Text("LOẠI AIMBOT")
                                  .font(.system(size: 12, weight: .bold))
                                  .foregroundColor(.purple)
                              
                              Toggle("Aimbot", isOn: $optimizer.isAimBotActive)
                              Toggle("Aimbot Vector", isOn: $optimizer.isAimbotVector)
                              Toggle("Aim Silent", isOn: $optimizer.isAimSilent)
                              
                              Divider()
                              
                              Text("Xương:")
                                  .font(.system(size: 11, weight: .semibold))
                                  .foregroundColor(.gray)
                              
                              HStack(spacing: 6) {
                                  ForEach(["Head", "Neck", "Body"], id: \.self) { bone in
                                      Button(action: { optimizer.selectedBone = bone }) {
                                          Text(bone)
                                              .font(.system(size: 12, weight: .bold))
                                              .frame(maxWidth: .infinity)
                                              .padding(.vertical, 6)
                                              .background(optimizer.selectedBone == bone ? Color.purple : Color(.systemGray5))
                                              .foregroundColor(optimizer.selectedBone == bone ? .white : .primary)
                                              .cornerRadius(6)
                                      }
                                  }
                              }
                          }
                          .padding(14)
                          .background(Color(UIColor.secondarySystemGroupedBackground))
                          .cornerRadius(14)
                          
                          VStack(alignment: .leading, spacing: 12) {
                              Text("CÀI ĐẶT AIMBOT")
                                  .font(.system(size: 12, weight: .bold))
                                  .foregroundColor(.purple)
                              
                              HStack {
                                  Text("Vòng FOV: \(Int(optimizer.fovValue))")
                                  Spacer()
                              }
                              Slider(value: $optimizer.fovValue, in: 10...360, step: 1)
                                  .accentColor(.purple)
                              
                              HStack {
                                  Text("Khoảng cách Aimbot: \(Int(optimizer.aimDistance))m")
                                  Spacer()
                              }
                              Slider(value: $optimizer.aimDistance, in: 10...500, step: 5)
                                  .accentColor(.purple)
                          }
                          .padding(14)
                          .background(Color(UIColor.secondarySystemGroupedBackground))
                          .cornerRadius(14)
                      }
                      .padding(14)
                      .padding(.bottom, 80)
                  }
              }
          }

          struct VisualsTabView: View {
              @ObservedObject var optimizer: GameOptimizer
              
              var body: some View {
                  ScrollView {
                      VStack(spacing: 14) {
                          VStack(alignment: .leading, spacing: 10) {
                              Text("HÌNH ẢNH & ESP")
                                  .font(.system(size: 12, weight: .bold))
                                  .foregroundColor(.purple)
                              
                              Toggle("ESP Khung", isOn: .constant(true))
                              Toggle("ESP Khoảng cách", isOn: .constant(true))
                              Toggle("ESP Máu", isOn: .constant(true))
                          }
                          .padding(14)
                          .background(Color(UIColor.secondarySystemGroupedBackground))
                          .cornerRadius(14)
                      }
                      .padding(14)
                      .padding(.bottom, 80)
                  }
              }
          }

          struct MiscTabView: View {
              @ObservedObject var optimizer: GameOptimizer
              @State private var showAlert = false
              @State private var alertMsg = ""

              var body: some View {
                  ScrollView {
                      VStack(spacing: 14) {
                          // Real Optimization Features
                          VStack(alignment: .leading, spacing: 10) {
                              Text("⚡ TỐI ƯU & NHỆ TÂM THỰC TẾ")
                                  .font(.system(size: 12, weight: .bold))
                                  .foregroundColor(.purple)
                              
                              Button(action: {
                                  optimizer.runNheTam()
                                  alertMsg = "Đã kích hoạt Nhẹ Tâm Pro thành công! Tâm súng đã được tối ưu độ ổn định."
                                  showAlert = true
                              }) {
                                  HStack {
                                      Image(systemName: "scope")
                                      Text("🎯 KÍCH HOẠT NHỆ TÂM PRO")
                                          .bold()
                                      Spacer()
                                      Image(systemName: "checkmark.circle.fill")
                                          .foregroundColor(.green)
                                  }
                                  .padding(12)
                                  .background(Color.green.opacity(0.15))
                                  .foregroundColor(.green)
                                  .cornerRadius(10)
                              }
                              
                              Button(action: {
                                  optimizer.runFixLag()
                                  alertMsg = "Đã Fix Lag & Max FPS thành công! RAM và bộ nhớ đệm đã được dọn sạch."
                                  showAlert = true
                              }) {
                                  HStack {
                                      Image(systemName: "bolt.fill")
                                      Text("⚡ FIX LAG & TĂNG TỐC MAX FPS")
                                          .bold()
                                      Spacer()
                                      Image(systemName: "checkmark.circle.fill")
                                          .foregroundColor(.purple)
                                  }
                                  .padding(12)
                                  .background(Color.purple.opacity(0.15))
                                  .foregroundColor(.purple)
                                  .cornerRadius(10)
                              }
                          }
                          .padding(14)
                          .background(Color(UIColor.secondarySystemGroupedBackground))
                          .cornerRadius(14)
                          
                          VStack(alignment: .leading, spacing: 10) {
                              Text("TÍNH NĂNG KHÁC")
                                  .font(.system(size: 12, weight: .bold))
                                  .foregroundColor(.purple)
                              
                              Toggle("Không giật", isOn: $optimizer.isNoRecoil)
                              Toggle("Không nạp đạn", isOn: $optimizer.isNoReload)
                              Toggle("Tăng tốc", isOn: .constant(false))
                              
                              HStack {
                                  Text("Tốc độ: \(String(format: "%.1fx", optimizer.speedValue))")
                                  Spacer()
                              }
                              Slider(value: $optimizer.speedValue, in: 1.0...3.0, step: 0.1)
                                  .accentColor(.purple)
                              
                              Toggle("Medkit nhanh", isOn: $optimizer.isFastMedkit)
                              Toggle("Bắn nhanh", isOn: $optimizer.isFastShoot)
                          }
                          .padding(14)
                          .background(Color(UIColor.secondarySystemGroupedBackground))
                          .cornerRadius(14)
                      }
                      .padding(14)
                      .padding(.bottom, 80)
                  }
                  .alert(isPresented: $showAlert) {
                      Alert(title: Text("THÔNG BÁO TỐI ƯU"), message: Text(alertMsg), dismissButton: .default(Text("OK")))
                  }
              }
          }

          struct SettingsTabView: View {
              @ObservedObject var optimizer: GameOptimizer
              
              var body: some View {
                  ScrollView {
                      VStack(spacing: 14) {
                          VStack(alignment: .leading, spacing: 10) {
                              Text("QUYỀN RIÊNG TƯ")
                                  .font(.system(size: 12, weight: .bold))
                                  .foregroundColor(.purple)
                              
                              Toggle("Chống stream", isOn: .constant(false))
                          }
                          .padding(14)
                          .background(Color(UIColor.secondarySystemGroupedBackground))
                          .cornerRadius(14)
                          
                          VStack(alignment: .leading, spacing: 10) {
                              Text("THÔNG TIN BẢN QUYỀN")
                                  .font(.system(size: 12, weight: .bold))
                                  .foregroundColor(.purple)
                              
                              HStack {
                                  Text("Bản quyền:")
                                  Spacer()
                                  Text("DELTA").bold()
                              }
                              HStack {
                                  Text("Hạn dùng:")
                                  Spacer()
                                  Text("Lifetime").bold().foregroundColor(.green)
                              }
                              HStack {
                                  Text("UUID:")
                                  Spacer()
                                  Text("IV-F97234C4-782D-4206-AE92-ADEB18949FB3")
                                      .font(.system(size: 10, design: .monospaced))
                                      .foregroundColor(.gray)
                              }
                          }
                          .padding(14)
                          .background(Color(UIColor.secondarySystemGroupedBackground))
                          .cornerRadius(14)
                          
                          VStack(alignment: .leading, spacing: 10) {
                              Text("HỖ TRỢ & HỆ THỐNG")
                                  .font(.system(size: 12, weight: .bold))
                                  .foregroundColor(.purple)
                              
                              Button(action: {}) {
                                  HStack {
                                      Text("Liên hệ hỗ trợ (Discord)")
                                      Spacer()
                                      Image(systemName: "arrow.up.right")
                                  }
                                  .foregroundColor(.primary)
                              }
                              
                              Divider()
                              
                              Button(action: {}) {
                                  Text("Đăng xuất tài khoản")
                                      .foregroundColor(.red)
                                      .bold()
                              }
                          }
                          .padding(14)
                          .background(Color(UIColor.secondarySystemGroupedBackground))
                          .cornerRadius(14)
                      }
                      .padding(14)
                      .padding(.bottom, 80)
                  }
              }
          }

          @main
          struct AppEntry {
              static func main() {
                  UIApplicationMain(
                      CommandLine.argc,
                      CommandLine.unsafeArgv,
                      nil,
                      NSStringFromClass(AppDelegate.self)
                  )
              }
          }

          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let window = UIWindow(frame: UIScreen.main.bounds)
                  window.rootViewController = UIHostingController(rootView: ContentView())
                  self.window = window
                  window.makeKeyAndVisible()
                  return true
              }
          }
          EOF

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc -sdk $SDK_PATH -target arm64-apple-ios14.0 AppSource/main.swift -o bindepzai123

          mkdir -p Payload/bindepzai123.app
          mv bindepzai123 Payload/bindepzai123.app/
          
          if [ -f "AppIcon.png" ]; then
              cp AppIcon.png Payload/bindepzai123.app/AppIcon60x60@2x.png
          fi

          cat << 'EOF' > Payload/bindepzai123.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>bindepzai123</string>
              <key>CFBundleIdentifier</key>
              <string>com.bindepzai123.app</string>
              <key>CFBundleName</key>
              <string>bindepzai123</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
          </dict>
          </plist>
          EOF

          zip -r bindepzai123.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindepzai123-ipa
          path: bindepzai123.ipa
