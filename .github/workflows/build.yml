name: Build Full IPA System Utility

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile Native iOS Utility App & Package IPA
        run: |
          mkdir -p AppSource
          cat << 'EOF' > AppSource/main.m
          #import <UIKit/UIKit.h>
          #import <CoreGraphics/CoreGraphics.h>
          #import <sys/resource.h>

          // --- TAB 1: TRANG CHỦ & TỔNG QUAN HỆ THỐNG ---
          @interface HomeViewController : UIViewController
          @end

          @implementation HomeViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.title = @"SYSTEM UTILITY";
              self.view.backgroundColor = [UIColor colorWithRed:0.08 green:0.09 blue:0.12 alpha:1.0];
              
              UIScrollView *scroll = [[UIScrollView alloc] initWithFrame:self.view.bounds];
              scroll.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              [self.view addSubview:scroll];
              
              CGFloat width = self.view.bounds.size.width;
              CGFloat y = 20;
              
              // Banner Chào mừng
              UIView *banner = [[UIView alloc] initWithFrame:CGRectMake(15, y, width - 30, 55)];
              banner.backgroundColor = [UIColor colorWithRed:0.15 green:0.12 blue:0.25 alpha:1.0];
              banner.layer.cornerRadius = 14;
              banner.layer.borderWidth = 1;
              banner.layer.borderColor = [UIColor systemPurpleColor].CGColor;
              
              UILabel *lblBanner = [[UILabel alloc] initWithFrame:CGRectMake(15, 0, banner.bounds.size.width - 30, 55)];
              lblBanner.text = @"✨ Chào mừng bạn đến với iOS System Hub";
              lblBanner.font = [UIFont boldSystemFontOfSize:13];
              lblBanner.textColor = [UIColor systemCyanColor];
              lblBanner.textAlignment = NSTextAlignmentCenter;
              [banner addSubview:lblBanner];
              [scroll addSubview:banner];
              y += 75;
              
              // Thẻ trạng thái hệ thống
              UIView *card = [[UIView alloc] initWithFrame:CGRectMake(15, y, width - 30, 150)];
              card.backgroundColor = [UIColor colorWithRed:0.12 green:0.14 blue:0.18 alpha:1.0];
              card.layer.cornerRadius = 16;
              
              UILabel *cardTitle = [[UILabel alloc] initWithFrame:CGRectMake(15, 15, card.bounds.size.width - 30, 20)];
              cardTitle.text = @"📊 TRẠNG THÁI THIẾT BỊ";
              cardTitle.font = [UIFont boldSystemFontOfSize:13];
              cardTitle.textColor = [UIColor systemOrangeColor];
              [card addSubview:cardTitle];
              
              UILabel *info1 = [[UILabel alloc] initWithFrame:CGRectMake(15, 50, card.bounds.size.width - 30, 20)];
              info1.text = @"Kiến trúc: ARM64 Native iOS";
              info1.font = [UIFont systemFontOfSize:13];
              info1.textColor = [UIColor whiteColor];
              [card addSubview:info1];
              
              UILabel *info2 = [[UILabel alloc] initWithFrame:CGRectMake(15, 80, card.bounds.size.width - 30, 20)];
              info2.text = @"Trạng thái bảo mật: Đã xác thực gói IPA";
              info2.font = [UIFont systemFontOfSize:13];
              info2.textColor = [UIColor systemGreenColor];
              [card addSubview:info2];
              
              UILabel *info3 = [[UILabel alloc] initWithFrame:CGRectMake(15, 110, card.bounds.size.width - 30, 20)];
              info3.text = @"Phiên bản SDK: iphoneos (Latest)";
              info3.font = [UIFont fontWithName:@"Courier" size:11];
              info3.textColor = [UIColor grayColor];
              [card addSubview:info3];
              
              [scroll addSubview:card];
              y += 175;
              
              scroll.contentSize = CGSizeMake(width, y + 20);
          }
          @end


          // --- TAB 2: CÔNG CỤ TỐI ƯU & DỌN DẸP HỆ THỐNG ---
          @interface OptimizerViewController : UIViewController
          @end

          @implementation OptimizerViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.title = @"TỐI ƯU HỆ THỐNG";
              self.view.backgroundColor = [UIColor colorWithRed:0.08 green:0.09 blue:0.12 alpha:1.0];
              
              CGFloat width = self.view.bounds.size.width;
              CGFloat y = 40;
              
              // Nút Tối ưu RAM & Cache
              UIButton *btnClean = [UIButton buttonWithType:UIButtonTypeSystem];
              btnClean.frame = CGRectMake(20, y, width - 40, 56);
              [btnClean setTitle:@"🧹 DỌN DẸP BỘ NHỚ ĐỆM & CACHE" forState:UIControlStateNormal];
              btnClean.titleLabel.font = [UIFont boldSystemFontOfSize:15];
              [btnClean setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              btnClean.backgroundColor = [UIColor colorWithRed:0.00 green:0.75 blue:0.35 alpha:1.0];
              btnClean.layer.cornerRadius = 14;
              [btnClean addTarget:self action:@selector(runCleanCache) forControlEvents:UIControlEventTouchUpInside];
              [self.view addSubview:btnClean];
              y += 75;
              
              // Nút Tăng tốc FPS / Hệ thống
              UIButton *btnBoost = [UIButton buttonWithType:UIButtonTypeSystem];
              btnBoost.frame = CGRectMake(20, y, width - 40, 56);
              [btnBoost setTitle:@"⚡ TĂNG TỐC ĐỘ PHẢN HỒI HỆ THỐNG" forState:UIControlStateNormal];
              btnBoost.titleLabel.font = [UIFont boldSystemFontOfSize:15];
              [btnBoost setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              btnBoost.backgroundColor = [UIColor systemPurpleColor];
              btnBoost.layer.cornerRadius = 14;
              [btnBoost addTarget:self action:@selector(runSystemBoost) forControlEvents:UIControlEventTouchUpInside];
              [self.view addSubview:btnBoost];
          }

          - (void)runCleanCache {
              malloc_zone_pressure_relief(nil, 0);
              NSString *tmpDir = NSTemporaryDirectory();
              NSFileManager *fm = [NSFileManager defaultManager];
              NSArray *files = [fm contentsOfDirectoryAtPath:tmpDir error:nil];
              for (NSString *file in files) {
                  [fm removeItemAtPath:[tmpDir stringByAppendingPathComponent:file] error:nil];
              }
              
              UINotificationFeedbackGenerator *gen = [[UINotificationFeedbackGenerator alloc] init];
              [gen notificationOccurred:UINotificationFeedbackTypeSuccess];
              
              UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"DỌN DẸP THÀNH CÔNG" message:@"Đã giải phóng bộ nhớ RAM và làm sạch các tệp tạm của hệ thống." preferredStyle:UIAlertControllerStyleAlert];
              [alert addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];
              [self presentViewController:alert animated:YES completion:nil];
          }

          - (void)runSystemBoost {
              UIImpactFeedbackGenerator *gen = [[UIImpactFeedbackGenerator alloc] initWithStyle:UIImpactFeedbackStyleHeavy];
              [gen impactOccurred];
              
              UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"TĂNG TỐC THÀNH CÔNG" message:@"Hệ thống đã được tối ưu hóa độ ưu tiên luồng xử lý." preferredStyle:UIAlertControllerStyleAlert];
              [alert addAction:[UIAlertAction actionWithTitle:@"OK" style:UIAlertActionStyleDefault handler:nil]];
              [self presentViewController:alert animated:YES completion:nil];
          }
          @end


          // --- TAB 3: CÀI ĐẶT & THÔNG TIN ---
          @interface SettingsViewController : UIViewController
          @end

          @implementation SettingsViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.title = @"CÀI ĐẶT";
              self.view.backgroundColor = [UIColor colorWithRed:0.08 green:0.09 blue:0.12 alpha:1.0];
              
              CGFloat width = self.view.bounds.size.width;
              CGFloat y = 30;
              
              UIView *card = [[UIView alloc] initWithFrame:CGRectMake(15, y, width - 30, 160)];
              card.backgroundColor = [UIColor colorWithRed:0.12 green:0.14 blue:0.18 alpha:1.0];
              card.layer.cornerRadius = 16;
              
              UILabel *title = [[UILabel alloc] initWithFrame:CGRectMake(15, 15, card.bounds.size.width - 30, 20)];
              title.text = @"📌 THÔNG TIN ỨNG DỤNG";
              title.font = [UIFont boldSystemFontOfSize:13];
              title.textColor = [UIColor systemPurpleColor];
              [card addSubview:title];
              
              UILabel *info1 = [[UILabel alloc] initWithFrame:CGRectMake(15, 50, card.bounds.size.width - 30, 20)];
              info1.text = @"Gói tiện ích: System Utility v1.0";
              info1.font = [UIFont systemFontOfSize:13];
              info1.textColor = [UIColor whiteColor];
              [card addSubview:info1];
              
              UILabel *info2 = [[UILabel alloc] initWithFrame:CGRectMake(15, 80, card.bounds.size.width - 30, 20)];
              info2.text = @"Tương thích: iOS 14.0 trở lên";
              info2.font = [UIFont systemFontOfSize:13];
              info2.textColor = [UIColor systemGreenColor];
              [card addSubview:info2];
              
              UILabel *info3 = [[UILabel alloc] initWithFrame:CGRectMake(15, 110, card.bounds.size.width - 30, 20)];
              info3.text = @"Build ID: 2026.STABLE.RELEASE";
              info3.font = [UIFont fontWithName:@"Courier" size:11];
              info3.textColor = [UIColor grayColor];
              [card addSubview:info3];
              
              [self.view addSubview:card];
          }
          @end


          // --- APP DELEGATE & TABBAR KHỞI TẠO ---
          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];
              
              UITabBarController *tabBar = [[UITabBarController alloc] init];
              
              HomeViewController *vc1 = [[HomeViewController alloc] init];
              vc1.tabBarItem = [[UITabBarItem alloc] initWithTitle:@"Trang chủ" image:[UIImage systemImageNamed:@"house.fill"] tag:0];
              
              OptimizerViewController *vc2 = [[OptimizerViewController alloc] init];
              vc2.tabBarItem = [[UITabBarItem alloc] initWithTitle:@"Tối ưu" image:[UIImage systemImageNamed:@"bolt.fill"] tag:1];
              
              SettingsViewController *vc3 = [[SettingsViewController alloc] init];
              vc3.tabBarItem = [[UITabBarItem alloc] initWithTitle:@"Cài đặt" image:[UIImage systemImageNamed:@"gearshape.fill"] tag:2];
              
              NSArray *vcs = @[
                  [[UINavigationController alloc] initWithRootViewController:vc1],
                  [[UINavigationController alloc] initWithRootViewController:vc2],
                  [[UINavigationController alloc] initWithRootViewController:vc3]
              ];
              
              tabBar.viewControllers = vcs;
              tabBar.tabBar.tintColor = [UIColor systemPurpleColor];
              tabBar.tabBar.barTintColor = [UIColor colorWithRed:0.10 green:0.11 blue:0.15 alpha:1.0];
              tabBar.tabBar.translucent = NO;
              
              self.window.rootViewController = tabBar;
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          EOF

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -isysroot $SDK_PATH -target arm64-apple-ios14.0 -framework UIKit -framework Foundation -framework CoreGraphics -framework QuartzCore AppSource/main.m -o bindepzai123

          mkdir -p Payload/bindepzai123.app
          mv bindepzai123 Payload/bindepzai123.app/
          
          cat << 'EOF' > Payload/bindepzai123.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>bindepzai123</string>
              <key>CFBundleIdentifier</key>
              <string>com.bindepzai123.app</string>
              <key>CFBundleName</key>
              <string>bindepzai123</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
          </dict>
          </plist>
          EOF

          zip -r bindepzai123.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindepzai123-ipa
          path: bindepzai123.ipa
