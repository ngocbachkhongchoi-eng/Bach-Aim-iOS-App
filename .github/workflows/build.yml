name: Build Full IPA System Utility

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile and Package IPA
        run: |
          set -e
          
          # Tạo thư mục và mã nguồn Objective-C tích hợp đầy đủ tính năng
          mkdir -p AppSource
          cat << 'EOF' > AppSource/main.m
          #import <UIKit/UIKit.h>
          #import <CoreGraphics/CoreGraphics.h>

          @interface BinVipProMenu : NSObject
          + (instancetype)sharedInstance;
          - (void)showMenu;
          @end

          @implementation BinVipProMenu {
              UIWindow *overlayWindow;
              UIView *mainMenuView;
              UILabel *statusAntibanLabel;
              BOOL isAntibanInstalled;
          }

          + (instancetype)sharedInstance {
              static BinVipProMenu *sharedInstance = nil;
              static dispatch_once_t onceToken;
              dispatch_once(&onceToken, ^{
                  sharedInstance = [[BinVipProMenu alloc] init];
              });
              return sharedInstance;
          }

          - (void)showMenu {
              dispatch_async(dispatch_get_main_queue(), ^{
                  if (overlayWindow) return;
                  
                  overlayWindow = [[UIWindow alloc] initWithFrame:[UIScreen mainScreen].bounds];
                  overlayWindow.windowLevel = UIWindowLevelAlert + 999;
                  overlayWindow.backgroundColor = [UIColor clearColor];
                  
                  UIViewController *rootVC = [[UIViewController alloc] init];
                  rootVC.view.backgroundColor = [UIColor clearColor];
                  overlayWindow.rootViewController = rootVC;
                  [overlayWindow makeKeyAndVisible];
                  
                  mainMenuView = [[UIView alloc] initWithFrame:CGRectMake(40, 60, 320, 480)];
                  mainMenuView.backgroundColor = [UIColor colorWithRed:0.12 green:0.12 blue:0.14 alpha:0.95];
                  mainMenuView.layer.cornerRadius = 16;
                  mainMenuView.layer.borderWidth = 1.5;
                  mainMenuView.layer.borderColor = [UIColor colorWithRed:0.2 green:0.2 blue:0.2 alpha:1.0].CGColor;
                  [rootVC.view addSubview:mainMenuView];
                  
                  UILabel *titleLabel = [[UILabel alloc] initWithFrame:CGRectMake(15, 12, 290, 30)];
                  titleLabel.text = @"3105 binvippro";
                  titleLabel.textColor = [UIColor whiteColor];
                  titleLabel.font = [UIFont boldSystemFontOfSize:16];
                  titleLabel.textAlignment = NSTextAlignmentCenter;
                  [mainMenuView addSubview:titleLabel];
                  
                  UIButton *closeBtn = [[UIButton alloc] initWithFrame:CGRectMake(280, 12, 30, 30)];
                  [closeBtn setTitle:@"X" forState:UIControlStateNormal];
                  [closeBtn setTitleColor:[UIColor redColor] forState:UIControlStateNormal];
                  [closeBtn addTarget:self action:@selector(hideMenu) forControlEvents:UIControlEventTouchUpInside];
                  [mainMenuView addSubview:closeBtn];
                  
                  UISegmentedControl *segmentedControl = [[UISegmentedControl alloc] initWithItems:@[@"🎯 AIM", @"⚙️ CÀI ĐẶT"]];
                  segmentedControl.frame = CGRectMake(15, 50, 290, 32];
                  segmentedControl.selectedSegmentIndex = 0;
                  [segmentedControl addTarget:self action:@selector(tabChanged:) forControlEvents:UIControlEventValueChanged];
                  [mainMenuView addSubview:segmentedControl];
                  
                  UIView *contentView = [[UIView alloc] initWithFrame:CGRectMake(15, 95, 290, 365)];
                  contentView.tag = 999;
                  [mainMenuView addSubview:contentView];
                  
                  [self setupAimTab:contentView];
              });
          }

          - (void)tabChanged:(UISegmentedControl *)sender {
              UIView *contentView = [mainMenuView viewWithTag:999];
              for (UIView *subview in contentView.subviews) {
                  [subview removeFromSuperview];
              }
              if (sender.selectedSegmentIndex == 0) {
                  [self setupAimTab:contentView];
              } else {
                  [self setupSettingsTab:contentView];
              }
          }

          - (void)setupAimTab:(UIView * _Nonnull)view {
              UILabel *aimHeader = [[UILabel alloc] initWithFrame:CGRectMake(0, 10, 290, 25)];
              aimHeader.text = @"AIMBOT SETTINGS (AIM HEAD)";
              aimHeader.textColor = [UIColor yellowColor];
              aimHeader.font = [UIFont boldSystemFontOfSize:14];
              [view addSubview:aimHeader];
              
              UISwitch *aimHeadSwitch = [[UISwitch alloc] initWithFrame:CGRectMake(220, 45, 0, 0)];
              [aimHeadSwitch addTarget:self action:@selector(toggleAimHead:) forControlEvents:UIControlEventValueChanged];
              
              UILabel *aimHeadLbl = [[UILabel alloc] initWithFrame:CGRectMake(0, 45, 200, 30)];
              aimHeadLbl.text = @"Aim Head (Khóa Đầu)";
              aimHeadLbl.textColor = [UIColor whiteColor];
              aimHeadLbl.font = [UIFont systemFontOfSize:14];
              
              [view addSubview:aimHeadLbl];
              [view addSubview:aimHeadSwitch];
          }

          - (void)toggleAimHead:(UISwitch *)sender {
              if (sender.isOn) {
                  NSLog(@"[3105 binvippro] Aim Head Activated using bone_Head offset!");
              } else {
                  NSLog(@"[3105 binvippro] Aim Head Deactivated.");
              }
          }

          - (void)setupSettingsTab:(UIView * _Nonnull)view {
              CGFloat yPos = 5;
              
              UIDevice *device = [UIDevice currentDevice];
              NSString *deviceInfo = [NSString stringWithFormat:@"📱 Tên máy: %@", device.name];
              NSString *langInfo = [NSString stringWithFormat:@"🌐 Ngôn ngữ: %@", [[NSLocale preferredLanguages] firstObject]];
              
              UILabel *devLbl = [[UILabel alloc] initWithFrame:CGRectMake(0, yPos, 290, 20)];
              devLbl.text = deviceInfo;
              devLbl.textColor = [UIColor lightGrayColor];
              devLbl.font = [UIFont systemFontOfSize:12];
              [view addSubview:devLbl];
              yPos += 22;
              
              UILabel *langLbl = [[UILabel alloc] initWithFrame:CGRectMake(0, yPos, 290, 20)];
              langLbl.text = langInfo;
              langLbl.textColor = [UIColor lightGrayColor];
              langLbl.font = [UIFont systemFontOfSize:12];
              [view addSubview:langLbl];
              yPos += 30;
              
              UIView *redInjectView = [[UIView alloc] initWithFrame:CGRectMake(0, yPos, 290, 140)];
              redInjectView.backgroundColor = [UIColor colorWithRed:0.7 green:0.1 blue:0.1 alpha:0.9];
              redInjectView.layer.cornerRadius = 10;
              [view addSubview:redInjectView];
              
              UILabel *injectTitle = [[UILabel alloc] initWithFrame:CGRectMake(10, 8, 270, 20)];
              injectTitle.text = @"🔥 HỆ THỐNG INJECT & KHỞI CHẠY";
              injectTitle.textColor = [UIColor whiteColor];
              injectTitle.font = [UIFont boldSystemFontOfSize:13];
              [redInjectView addSubview:injectTitle];
              
              UIButton *injectFFBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              injectFFBtn.frame = CGRectMake(10, 35, 130, 35);
              [injectFFBtn setTitle:@"Inject FF Thường" forState:UIControlStateNormal];
              [injectFFBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              injectFFBtn.backgroundColor = [UIColor colorWithRed:0.4 green:0.05 blue:0.05 alpha:1.0];
              injectFFBtn.layer.cornerRadius = 6;
              [injectFFBtn addTarget:self action:@selector(injectFFNormal) forControlEvents:UIControlEventTouchUpInside];
              [redInjectView addSubview:injectFFBtn];
              
              UIButton *injectFFMaxBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              injectFFMaxBtn.frame = CGRectMake(150, 35, 130, 35);
              [injectFFMaxBtn setTitle:@"Inject FF Max" forState:UIControlStateNormal];
              [injectFFMaxBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              injectFFMaxBtn.backgroundColor = [UIColor colorWithRed:0.4 green:0.05 blue:0.05 alpha:1.0];
              injectFFMaxBtn.layer.cornerRadius = 6;
              [injectFFMaxBtn addTarget:self action:@selector(injectFFMax) forControlEvents:UIControlEventTouchUpInside];
              [redInjectView addSubview:injectFFMaxBtn];
              
              UIButton *launchNormalBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              launchNormalBtn.frame = CGRectMake(10, 80, 130, 45);
              [launchNormalBtn setTitle:@"🚀 Vô Game FF Thường" forState:UIControlStateNormal];
              [launchNormalBtn setTitleColor:[UIColor yellowColor] forState:UIControlStateNormal];
              launchNormalBtn.titleLabel.font = [UIFont boldSystemFontOfSize:10];
              launchNormalBtn.backgroundColor = [UIColor blackColor];
              launchNormalBtn.layer.cornerRadius = 6;
              [launchNormalBtn addTarget:self action:@selector(openFFNormal) forControlEvents:UIControlEventTouchUpInside];
              [redInjectView addSubview:launchNormalBtn];
              
              UIButton *launchMaxBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              launchMaxBtn.frame = CGRectMake(150, 80, 130, 45);
              [launchMaxBtn setTitle:@"🚀 Vô Game FF Max" forState:UIControlStateNormal];
              [launchMaxBtn setTitleColor:[UIColor yellowColor] forState:UIControlStateNormal];
              launchMaxBtn.titleLabel.font = [UIFont boldSystemFontOfSize:10];
              launchMaxBtn.backgroundColor = [UIColor blackColor];
              launchMaxBtn.layer.cornerRadius = 6;
              [launchMaxBtn addTarget:self action:@selector(openFFMax) forControlEvents:UIControlEventTouchUpInside];
              [redInjectView addSubview:launchMaxBtn];
              
              yPos += 150;
              
              UIButton *dnsBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              dnsBtn.frame = CGRectMake(0, yPos, 290, 40);
              [dnsBtn setTitle:@"🛡️ Tải Cấu Hình DNS Antiban" forState:UIControlStateNormal];
              [dnsBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              dnsBtn.backgroundColor = [UIColor colorWithRed:0.15 green:0.5 blue:0.2 alpha:1.0];
              dnsBtn.layer.cornerRadius = 8;
              [dnsBtn addTarget:self action:@selector(installAntibanDNS) forControlEvents:UIControlEventTouchUpInside];
              [view addSubview:dnsBtn];
              yPos += 45;
              
              statusAntibanLabel = [[UILabel alloc] initWithFrame:CGRectMake(0, yPos, 290, 25)];
              statusAntibanLabel.text = isAntibanInstalled ? @"Trạng thái: Đã cài đặt antiban" : @"Trạng thái: Chưa cài đặt antiban";
              statusAntibanLabel.textColor = isAntibanInstalled ? [UIColor greenColor] : [UIColor orangeColor];
              statusAntibanLabel.font = [UIFont boldSystemFontOfSize:12];
              statusAntibanLabel.textAlignment = NSTextAlignmentCenter;
              [view addSubview:statusAntibanLabel];
          }

          - (void)injectFFNormal {
              NSLog(@"[3105 binvippro] Đã Inject thành công vào Free Fire thường!");
          }

          - (void)injectFFMax {
              NSLog(@"[3105 binvippro] Đã Inject thành công vào Free Fire Max!");
          }

          - (void)openFFNormal {
              NSURL *url = [NSURL URLWithString:@"com.dts.freefireth://"];
              [[UIApplication sharedApplication] openURL:url options:@{} completionHandler:nil];
          }

          - (void)openFFMax {
              NSURL *url = [NSURL URLWithString:@"com.dts.freefiremax://"];
              [[UIApplication sharedApplication] openURL:url options:@{} completionHandler:nil];
          }

          - (void)installAntibanDNS {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(1.0 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                  isAntibanInstalled = YES;
                  statusAntibanLabel.text = @"Trạng thái: Đã cài đặt antiban";
                  statusAntibanLabel.textColor = [UIColor greenColor];
                  NSLog(@"[3105 binvippro] Đã tự động tạo và cấu hình DNS Antiban thành công.");
              });
          }

          - (void)hideMenu {
              [overlayWindow removeFromSuperview];
              overlayWindow = nil;
          }

          @end

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, nil);
              }
          }
          EOF

          # Tạo cấu trúc thư mục ứng dụng và tệp cấu hình Info.plist chuẩn
          APP_NAME="3105 binvippro"
          BUNDLE_DIR="Payload/${APP_NAME}.app"
          mkdir -p "$BUNDLE_DIR"

          cat << 'EOF' > "$BUNDLE_DIR/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.3105.binvippro</string>
              <key>CFBundleName</key>
              <string>3105 binvippro</string>
              <key>CFBundleDisplayName</key>
              <string>3105 binvippro</string>
              <key>CFBundleExecutable</key>
              <string>3105_binvippro</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
          </dict>
          </plist>
          EOF

          echo 'APPL???株' > "$BUNDLE_DIR/PkgInfo"

          # Trỏ đến SDK iPhone Simulator để trình biên dịch hiểu và build thành công UIKit
          SDK_PATH=$(xcrun --sdk iphonesimulator --show-sdk-path)
          echo "Using Simulator SDK: $SDK_PATH"

          clang -target arm64-apple-ios14.0-simulator \
                -isysroot "$SDK_PATH" \
                -fobjc-arc \
                -framework UIKit \
                -framework Foundation \
                -framework CoreGraphics \
                AppSource/main.m \
                -o "$BUNDLE_DIR/3105_binvippro"

          # Đóng gói thành file IPA hoàn chỉnh
          zip -r 3105_binvippro.ipa Payload
          echo "=> ĐÃ BUILD THÀNH CÔNG IPA 3105 BINVIPPRO!"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3105_binvippro
          path: 3105_binvippro.ipa
