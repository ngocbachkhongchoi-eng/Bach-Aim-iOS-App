name: Build Full IPA bindepzai123

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile Native iOS Binary & Package IPA
        run: |
          mkdir -p AppSource
          cat << 'EOF' > AppSource/main.m
          #import <UIKit/UIKit.h>

          @interface MainViewController : UIViewController
          @end

          @implementation MainViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor systemBlueColor];
              
              UILabel *label = [[UILabel alloc] initWithFrame:CGRectMake(20, 80, self.view.bounds.size.width - 40, 60)];
              label.text = @"🔥 MENU FREE FIRE & IPA TOOLS 🔥";
              label.font = [UIFont boldSystemFontOfSize:20];
              label.textColor = [UIColor whiteColor];
              label.textAlignment = NSTextAlignmentCenter;
              [self.view addSubview:label];
              
              NSArray *btnTitles = @[@"Inject FF Max", @"Inject FF Thường", @"Vào FF Max", @"Vào FF Thường", @"⚡ Fix Lag / Siêu Lag / Nhẹ Tâm"];
              NSArray *btnColors = @[[UIColor systemOrangeColor], [UIColor systemRedColor], [UIColor systemPurpleColor], [UIColor systemIndigoColor], [UIColor systemGreenColor]];
              
              for (int i = 0; i < btnTitles.count; i++) {
                  UIButton *btn = [UIButton buttonWithType:UIButtonTypeSystem];
                  btn.frame = CGRectMake(30, 160 + (i * 60), self.view.bounds.size.width - 60, 48);
                  [btn setTitle:btnTitles[i] forState:UIControlStateNormal];
                  btn.titleLabel.font = [UIFont boldSystemFontOfSize:16];
                  [btn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
                  btn.backgroundColor = btnColors[i];
                  btn.layer.cornerRadius = 12;
                  [self.view addSubview:btn];
              }
          }
          @end

          @interface LoginViewController : UIViewController <UITextFieldDelegate>
          @property (nonatomic, strong) UITextField *keyField;
          @property (nonatomic, strong) UILabel *errorLabel;
          @end

          @implementation LoginViewController
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.view.backgroundColor = [UIColor colorWithRed:0.8 green:0.1 blue:0.1 alpha:1.0];
              
              UILabel *titleLabel = [[UILabel alloc] initWithFrame:CGRectMake(20, 150, self.view.bounds.size.width - 40, 50)];
              titleLabel.text = @"BINDÉPZAI 123";
              titleLabel.font = [UIFont boldSystemFontOfSize:32];
              titleLabel.textColor = [UIColor whiteColor];
              titleLabel.textAlignment = NSTextAlignmentCenter;
              [self.view addSubview:titleLabel];
              
              self.keyField = [[UITextField alloc] initWithFrame:CGRectMake(40, 230, self.view.bounds.size.width - 80, 50)];
              self.keyField.placeholder = @" Nhập Key Bản Quyền...";
              self.keyField.secureTextEntry = YES;
              self.keyField.backgroundColor = [UIColor whiteColor];
              self.keyField.layer.cornerRadius = 12;
              self.keyField.font = [UIFont systemFontOfSize:18];
              [self.view addSubview:self.keyField];
              
              UIButton *loginBtn = [UIButton buttonWithType:UIButtonTypeSystem];
              loginBtn.frame = CGRectMake(40, 300, self.view.bounds.size.width - 80, 50);
              [loginBtn setTitle:@"XÁC NHẬN ĐĂNG NHẬP" forState:UIControlStateNormal];
              loginBtn.titleLabel.font = [UIFont boldSystemFontOfSize:18];
              [loginBtn setTitleColor:[UIColor whiteColor] forState:UIControlStateNormal];
              loginBtn.backgroundColor = [UIColor systemOrangeColor];
              loginBtn.layer.cornerRadius = 12;
              [loginBtn addTarget:self action:@selector(handleLogin) forControlEvents:UIControlEventTouchUpInside];
              [self.view addSubview:loginBtn];
              
              self.errorLabel = [[UILabel alloc] initWithFrame:CGRectMake(20, 370, self.view.bounds.size.width - 40, 30)];
              self.errorLabel.text = @"⚠️ Key không chính xác!";
              self.errorLabel.textColor = [UIColor yellowColor];
              self.errorLabel.textAlignment = NSTextAlignmentCenter;
              self.errorLabel.font = [UIFont boldSystemFontOfSize:16];
              self.errorLabel.hidden = YES;
              [self.view addSubview:self.errorLabel];
          }

          - (void)handleLogin {
              if ([self.keyField.text isEqualToString:@"bindepzai123"]) {
                  MainViewController *mainVC = [[MainViewController alloc] init];
                  mainVC.modalPresentationStyle = UIModalPresentationFullScreen;
                  [self presentViewController:mainVC animated:YES completion:nil];
              } else {
                  self.errorLabel.hidden = NO;
              }
          }
          @end

          @interface AppDelegate : UIResponder <UIApplicationDelegate>
          @property (strong, nonatomic) UIWindow *window;
          @end

          @implementation AppDelegate
          - (BOOL)application:(UIApplication *)application didFinishLaunchingWithOptions:(NSDictionary *)launchOptions {
              self.window = [[UIWindow alloc] initWithFrame:[[UIScreen mainScreen] bounds]];
              self.window.rootViewController = [[LoginViewController alloc] init];
              [self.window makeKeyAndVisible];
              return YES;
          }
          @end

          int main(int argc, char * argv[]) {
              @autoreleasepool {
                  return UIApplicationMain(argc, argv, nil, NSStringFromClass([AppDelegate class]));
              }
          }
          EOF

          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -isysroot $SDK_PATH -target arm64-apple-ios14.0 -framework UIKit -framework Foundation AppSource/main.m -o bindepzai123

          mkdir -p Payload/bindepzai123.app
          mv bindepzai123 Payload/bindepzai123.app/
          
          if [ -f "AppIcon.png" ]; then
              cp AppIcon.png Payload/bindepzai123.app/AppIcon60x60@2x.png
          fi

          cat << 'EOF' > Payload/bindepzai123.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>bindepzai123</string>
              <key>CFBundleIdentifier</key>
              <string>com.bindepzai123.app</string>
              <key>CFBundleName</key>
              <string>bindepzai123</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>MinimumOSVersion</key>
              <string>14.0</string>
          </dict>
          </plist>
          EOF

          zip -r bindepzai123.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindepzai123-ipa
          path: bindepzai123.ipa
